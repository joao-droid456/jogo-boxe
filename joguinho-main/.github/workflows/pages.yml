name: Publicar NEON RUSH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar regras do jogo
        run: |
          node --check dist/js/main.js
          node scripts/check.mjs
          node check-game.cjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
